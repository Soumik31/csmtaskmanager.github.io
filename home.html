<!DOCTYPE html>
<html lang="en">
<head>
    <title>Home</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="HandheldFriendly" content="true">

    <link rel="stylesheet" type="text/css" href="css/back.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto|Varela+Round|Open+Sans">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="icon" href="images/logo.png">
</head>
<header>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="home.html"> Welcome to CSM SOC Task Manager </a>
        </div>
        <button onclick="logout()" class="btn btn-primary btn-sm" role="button"><span class="glyphicon glyphicon-log-in"></span>Logout</button>
    </nav>
</header>
<body>

    <div class="d-flex justify-content-center">
        <a href="form.html" class="btn btn-secondary center-block" role="button">Create Task</a>

        <div class="btn-group" role="group">
            <button id="btnGroupDrop1" type="button" class="btn btn-secondary dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                Search Task
            </button>
            <div class="dropdown-menu" aria-labelledby="btnGroupDrop1">
                <a class="dropdown-item" href="searchdate.html">Search by Date</a>
                <a class="dropdown-item" href="searchname.html">Search by Name</a>
            </div>
        </div>
    </div>

    <div class="container">
        <h3 class="text-white">Pending Task <span id="pending-badge" class="badge badge-pill badge-info">0</span></h3>

        <div id="error-container"></div>

        <table id="editable_table" class="table table-bordered table-hover">
            <thead class="thead-dark text-sm-center">
                <tr>
                    <th>Task ID</th>
                    <th>ST</th>
                    <th>Task Name</th>
                    <th>Pending Time</th>
                    <th>Escalation Group</th>
                    <th>Escalation Time</th>
                    <th>Mail Reference</th>
                    <th>Task Update</th>
                    <th>Status</th>
                    <th>Severity</th>
                    <th>User</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="task-tbody" class="table-primary">
            </tbody>
        </table>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Auth guard
        requireAuth();

        // Store tasks globally for pending time refresh
        var pendingTasks = [];
        var pendingTimeInterval = null;

        // Load pending tasks on page load
        loadPendingTasks();

        /**
         * Fetches all pending tasks from Supabase and renders them.
         */
        async function loadPendingTasks() {
            // Clear any previous error
            var errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = '';

            try {
                var result = await supabase
                    .from('task')
                    .select('*')
                    .eq('stat', 'Pending');

                var data = result.data;
                var error = result.error;

                if (error) {
                    showLoadError('Could not load tasks. Please retry.');
                    return;
                }

                pendingTasks = data || [];
                renderTaskTable(pendingTasks);
                updateBadgeCount(pendingTasks.length);

                // Set up 60-second interval to refresh pending times
                if (pendingTimeInterval) {
                    clearInterval(pendingTimeInterval);
                }
                pendingTimeInterval = setInterval(refreshPendingTimes, 60000);

            } catch (err) {
                showLoadError('Could not load tasks. Please retry.');
            }
        }

        /**
         * Renders the task table rows from the given data array.
         */
        function renderTaskTable(tasks) {
            var tbody = document.getElementById('task-tbody');
            tbody.innerHTML = '';

            if (!tasks || tasks.length === 0) {
                return;
            }

            for (var i = 0; i < tasks.length; i++) {
                var task = tasks[i];
                var pendingTime = calculatePendingTime(task.task_id);
                var displayUser = getDisplayUser(task);
                var history = task.history || '';

                // Main task row
                var tr = document.createElement('tr');
                tr.className = 'text-center header';
                tr.innerHTML =
                    '<td>' + escapeHtml(task.task_id) + ' <span class="fa fa-plus"></span></td>' +
                    '<td>' + escapeHtml(task.st || '') + '</td>' +
                    '<td>' + escapeHtml(task.task_name || '') + '</td>' +
                    '<td class="pending-time" data-taskid="' + escapeHtml(task.task_id) + '">' + pendingTime + '</td>' +
                    '<td>' + escapeHtml(task.esc_grp || '') + '</td>' +
                    '<td>' + escapeHtml(task.esc_time || '') + '</td>' +
                    '<td>' + escapeHtml(task.mail_ref || '') + '</td>' +
                    '<td>' + escapeHtml(task.updt || '') + '</td>' +
                    '<td>' + escapeHtml(task.stat || '') + '</td>' +
                    '<td>' + escapeHtml(task.severity || '') + '</td>' +
                    '<td>' + escapeHtml(displayUser) + '</td>' +
                    '<td contenteditable="false"><a href="action.html?edit=' + encodeURIComponent(task.task_id) + '" class="btn btn-info">Edit</a></td>';
                tbody.appendChild(tr);

                // Hidden history row
                var historyTr = document.createElement('tr');
                historyTr.style.display = 'none';
                historyTr.innerHTML =
                    '<th colspan="1" class="text-sm-center">History</th>' +
                    '<td colspan="11"><p>' + history + '</p></td>';
                tbody.appendChild(historyTr);
            }

            // Bind click handlers for toggling history rows
            $('.header').click(function() {
                $(this).nextUntil('tr.header').slideToggle(500);
            });
        }

        /**
         * Refreshes the pending time display for all tasks without re-querying.
         */
        function refreshPendingTimes() {
            var cells = document.querySelectorAll('.pending-time');
            for (var i = 0; i < cells.length; i++) {
                var taskId = cells[i].getAttribute('data-taskid');
                if (taskId) {
                    cells[i].textContent = calculatePendingTime(taskId);
                }
            }
        }

        /**
         * Updates the badge count display.
         */
        function updateBadgeCount(count) {
            document.getElementById('pending-badge').textContent = count;
        }

        /**
         * Displays an error message with a retry button.
         */
        function showLoadError(message) {
            var errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML =
                '<div class="alert alert-danger" role="alert">' +
                message +
                ' <button class="btn btn-sm btn-outline-danger ml-2" onclick="loadPendingTasks()">Retry</button>' +
                '</div>';
        }

        /**
         * Escapes HTML special characters to prevent XSS.
         */
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            var str = String(text);
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }
    </script>

</body>
</html>
