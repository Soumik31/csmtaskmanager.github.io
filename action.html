<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="HandheldFriendly" content="true">
    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" type="text/css" href="css/back.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="build/css/bootstrap-datetimepicker.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.9/dist/css/bootstrap-select.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<header>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="home.html"> Edit Task </a>
        </div>
        <a href="#" onclick="logout()" class="btn btn-primary btn-sm" role="button"><span class="glyphicon glyphicon-log-in"></span>Logout</a>
    </nav>
</header>

<body>

    <div class="container needs-validation" id="main-container">
        <h3 class="text-white">Editing Task</h3>
        <div id="error-area"></div>
        <div id="task-form-area" style="display:none;">
            <table class="table table-bordered table-hover">
                <thead class="thead-dark text-sm-center">
                    <tr>
                        <th>Task Name</th>
                        <th>Task Update</th>
                        <th>Escalation Group</th>
                        <th>Status</th>
                        <th id="tim">ET</th>
                        <th>Severity</th>
                    </tr>
                </thead>
                <tbody class="table-primary">
                    <tr>
                        <td id="task-name-cell"></td>
                        <td>
                            <textarea rows="5" type="text" class="form-control" id="upt" maxlength="2000"></textarea>
                        </td>
                        <td>
                            <input type="hidden" id="escc" value="">
                            <select id="slect" class="form-control selectpicker" data-live-search="true" required>
                                <option selected value="choose">Choose...</option>
                                <option>VAS & DO</option>
                                <option>IN</option>
                                <option>Content Provider</option>
                                <option>FS Operations</option>
                                <option>Link3</option>
                                <option>Metro Net</option>
                                <option>ADN</option>
                                <option>Summit Communications</option>
                                <option>BDCOM</option>
                                <option>Telnet</option>
                                <option>Wipro</option>
                                <option>Level3</option>
                                <option>VDSO</option>
                                <option>RO</option>
                                <option>TNO</option>
                                <option>RNBM</option>
                                <option>Facebook</option>
                                <option>Google</option>
                                <option>ICX</option>
                                <option>Summit</option>
                                <option>TCM</option>
                                <option>Other Operator</option>
                                <option>Ericsson</option>
                                <option>I & C</option>
                                <option>Corporate Affairs- Inter Connection</option>
                                <option>Assurance</option>
                                <option>On-mobile</option>
                                <option>Bank</option>
                                <option>TGS</option>
                                <option>ATL</option>
                                <option>Election Commission</option>
                                <option>Synesis IT</option>
                                <option>ShebaTech</option>
                                <option>Huawei</option>
                                <option>Mango</option>
                                <option>RP</option>
                                <option>IR</option>
                                <option>CNP</option>
                                <option>CVM</option>
                                <option>BDIX</option>
                                <option>NTTN</option>
                                <option>Digi Jadoo</option>
                                <option>Bongo</option>
                                <option>OSS</option>
                                <option>ISEM</option>
                                <option>RAFM</option>
                                <option>Digital Partnership</option>
                                <option>Nokia</option>
                                <option>EC Connectivity Provider</option>
                                <option>Tonic</option>
                                <option>Digital Channels</option>
                                <option>Ezzy Support</option>
                                <option value="Others">Others</option>
                            </select>
                            <textarea class="form-control" id="txarea" rows="3" style="display:none;"></textarea>
                        </td>
                        <td>
                            <select id="sct" class="form-control" required>
                                <option>Pending</option>
                                <option value="Done">Done</option>
                            </select>
                        </td>
                        <td id="til" style="display:none;">
                            <div class="row" required>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" id="datetimepicker3" placeholder="">
                                </div>
                            </div>
                        </td>
                        <td>
                            <input type="hidden" id="ser" value="">
                            <select class="form-control" id="sev" required>
                                <option value="ko" selected>Choose...</option>
                                <option>Critical</option>
                                <option>Major</option>
                                <option>Minor</option>
                            </select>
                            <span id="current-severity"></span>
                        </td>
                    </tr>
                </tbody>
            </table>

            <button class="btn btn-primary" type="button" id="btn-update"> Update </button>
            <button class="btn btn-primary" type="button" id="btn-cancel"> Cancel </button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.9/dist/js/bootstrap-select.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.21.0/moment.min.js" type="text/javascript"></script>
    <script src="build/js/bootstrap-datetimepicker.min.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>

    <script>
        // Auth guard
        requireAuth();

        // State
        var taskId = new URLSearchParams(window.location.search).get('edit');
        var taskData = null;

        // Initialize datetimepicker
        $(function () {
            $('#datetimepicker3').datetimepicker();
        });

        // ET column show/hide based on status
        $("#tim").hide();
        $("#til").hide();
        $("#sct").change(function () {
            var val = $("#sct").val();
            if (val === "Done") {
                $("#tim").show();
                $("#til").show();
            } else {
                $("#tim").hide();
                $("#til").hide();
            }
        });

        // Others textarea show/hide
        $("#txarea").hide();
        $("#slect").change(function () {
            var val = $("#slect").val();
            if (val === "Others") {
                $("#txarea").show();
            } else {
                $("#txarea").hide();
            }
        });

        // Load task on page load
        loadTask();

        async function loadTask() {
            if (!taskId) {
                showTaskError('No task ID provided. <a href="home.html">Return to Dashboard</a>');
                return;
            }

            try {
                var result = await supabase
                    .from('task')
                    .select('*')
                    .eq('task_id', taskId)
                    .single();

                var data = result.data;
                var error = result.error;

                if (error || !data) {
                    showTaskError('Task not found. <a href="home.html">Return to Dashboard</a>');
                    return;
                }

                taskData = data;
                populateForm(data);
                document.getElementById('task-form-area').style.display = 'block';
            } catch (err) {
                showTaskError('Could not load task. <a href="home.html">Return to Dashboard</a>');
            }
        }

        function populateForm(task) {
            // Task name (read-only)
            document.getElementById('task-name-cell').textContent = task.task_name;

            // Store existing escalation group and history
            document.getElementById('escc').value = task.esc_grp || '';

            // Set current severity display
            document.getElementById('ser').value = task.severity || '';
            document.getElementById('current-severity').textContent = task.severity || '';
        }

        function showTaskError(message) {
            var errorArea = document.getElementById('error-area');
            errorArea.innerHTML = '<div class="alert alert-danger">' + message + '</div>';
        }

        // Update button handler
        document.getElementById('btn-update').addEventListener('click', async function () {
            var updateNote = document.getElementById('upt').value.trim();

            // Validate update note is non-empty
            if (!updateNote) {
                showError('Update note is required');
                return;
            }

            // Determine escalation group
            var escGroupVal = $('#slect').val();
            var escGroup;
            if (escGroupVal === 'choose') {
                escGroup = document.getElementById('escc').value;
            } else if (escGroupVal === 'Others') {
                escGroup = document.getElementById('txarea').value;
            } else {
                escGroup = escGroupVal;
            }

            // Determine severity
            var sevVal = document.getElementById('sev').value;
            var severity;
            if (sevVal !== 'ko') {
                severity = sevVal;
            } else {
                severity = document.getElementById('ser').value;
            }

            // Determine status and end time
            var status = document.getElementById('sct').value;
            var endTime = '';
            if (status === 'Done') {
                endTime = document.getElementById('datetimepicker3').value;
            }

            // Build history
            var existingHistory = taskData.history || '';
            var newEntry = buildHistoryEntry(getCurrentUser(), updateNote);
            var updatedHistory = existingHistory + newEntry;

            try {
                var result = await supabase
                    .from('task')
                    .update({
                        stat: status,
                        updt: updateNote,
                        history: updatedHistory,
                        esc_grp: escGroup,
                        end_t: endTime,
                        severity: severity,
                        uuser: getCurrentUser()
                    })
                    .eq('task_id', taskId);

                var error = result.error;

                if (error) {
                    showError('Update failed. Please try again.');
                    return;
                }

                window.location.href = 'home.html';
            } catch (err) {
                showError('Update failed. Please try again.');
            }
        });

        // Cancel button handler
        document.getElementById('btn-cancel').addEventListener('click', function () {
            window.location.href = 'home.html';
        });
    </script>

</body>
</html>
